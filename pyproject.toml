[project]
name = "kicad-mcp-layer"
version = "0.1.0"
description = "An AI layer for KiCad 10: an MCP server that drives KiCad through kicad-cli, the IPC API, and direct file edits."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Andrey Turakin" }]
keywords = ["kicad", "mcp", "eda", "pcb", "schematic", "claude"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
  "mcp>=2.1.1,<3",
  "pydantic>=2.12",
  # documentation layer: PDF text, page rendering, images
  "pypdf>=5",
  "pypdfium2>=4",
  "pillow>=10",
]

[project.optional-dependencies]
# the IPC channel (the board open in KiCad's PCB editor); the API changes with every KiCad major, so it is
# an extra: without it the doctor says so and every kicad-cli and file tool still works
ipc = ["kicad-python>=0.8.0,<0.9"]
dev = ["pytest>=8", "pytest-timeout>=2.3", "pytest-xdist>=3.5"]
# headless Chromium for documents behind scripted download portals; then run `python -m playwright install chromium`
browser = ["playwright>=1.45"]
# sheet previews as PNG (design/build.py --preview): kicad-cli exports PDF, PyMuPDF rasterises it
preview = ["pymupdf>=1.24"]
# lib_fetch: symbol, footprint and 3D model by LCSC code from EasyEDA's component data
parts = ["easyeda2kicad>=1.0"]

[project.scripts]
kicad-mcp-layer = "kicad_layer.server:main"

[project.urls]
Homepage = "https://github.com/ShamanAndrey/kicad-mcp-layer"
Repository = "https://github.com/ShamanAndrey/kicad-mcp-layer"
Issues = "https://github.com/ShamanAndrey/kicad-mcp-layer/issues"
Changelog = "https://github.com/ShamanAndrey/kicad-mcp-layer/blob/main/CHANGELOG.md"
Workspace = "https://github.com/ShamanAndrey/kicad-ai-stack"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kicad_layer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 180
# the default run is the fast loop: parallel, without the slow and the live tests. Before a commit:
#   python -m pytest -m "not gui"        (adds the slow tests)
#   python -m pytest -m ""               (everything, needs KiCad open with the API on)
addopts = '-n auto -m "not slow and not gui"'
markers = [
  "real_kicad: needs kicad-cli 10.x installed on this machine (self-skips otherwise)",
  "gui: needs a running KiCad with the API enabled (self-skips otherwise)",
  "slow: more than ten seconds (a full library index, a whole review, a headless browser); off in the default run",
]
filterwarnings = ["ignore::DeprecationWarning"]
